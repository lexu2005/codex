name: Merge IPTV Playlists

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run merging script
        env:
          IPTV_URLS: ${{ secrets.IPTV_URLS }}
        run: python merge_iptv.py

      - name: Commit and push combined playlist
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "actions@github.com"
          git add combined_iptv_playlist.m3u
          git diff-index --quiet HEAD || git commit -m "Automated update of combined playlist"
          git push
