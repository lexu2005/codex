<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Simple Live Site</title>
    <style>
        /* This styles your page to make it look clean and centered */
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            text-align: center;
            padding: 50px 20px;
            margin: 0;
        }
        .container {
            max-width: 600px;
            background: white;
            padding: 40px;
            margin: 0 auto;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        h1 {
            color: #007bff;
        }
        p {
            font-size: 18px;
            line-height: 1.6;
        }
        img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            margin: 20px 0;
        }
        .btn {
            display: inline-block;
            background-color: #007bff;
            color: white;
            padding: 12px 24px;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            margin-top: 15px;
        }
        .btn:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Hello World! 👋</h1>
        <p>Welcome to my brand new website. This page is stored in a GitHub repository and is running live online for free using GitHub Pages.</p>
        
        <!-- Replace 'my-photo.jpg' with the exact filename of any image you uploaded -->
        <img src="my-photo.jpg" alt="My Live Asset Preview">

        <br>
        <a href="https://github.com" class="btn" target="_blank">Visit GitHub Website</a>
    </div>

</body>
</html>
